```html
<!DOCTYPE html>
<html>

<head>

    <title>Java Calculator</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            margin-top: 80px;
        }

        .calculator {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #result {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="calculator">

    <h1>Java Calculator</h1>

    <input
        type="number"
        id="num1"
        placeholder="Enter first number"
    >

    <select id="operator">

        <option value="+">Addition (+)</option>
        <option value="-">Subtraction (-)</option>
        <option value="*">Multiplication (*)</option>
        <option value="/">Division (/)</option>

    </select>

    <input
        type="number"
        id="num2"
        placeholder="Enter second number"
    >

    <button onclick="calculate()">
        Calculate
    </button>

    <div id="result"></div>

</div>

<script>

function calculate() {

    let num1 = parseFloat(
        document.getElementById("num1").value
    );

    let num2 = parseFloat(
        document.getElementById("num2").value
    );

    let operator =
        document.getElementById("operator").value;

    let result;

    if (isNaN(num1) || isNaN(num2)) {

        document.getElementById("result").innerHTML =
            "Please enter both numbers.";

        return;
    }

    switch (operator) {

        case "+":
            result = num1 + num2;
            break;

        case "-":
            result = num1 - num2;
            break;

        case "*":
            result = num1 * num2;
            break;

        case "/":

            if (num2 === 0) {

                document.getElementById("result").innerHTML =
                    "Cannot divide by zero.";

                return;
            }

            result = num1 / num2;
            break;
    }

    document.getElementById("result").innerHTML =
        "Result: " + result;
}

</script>

</body>

</html>
```
